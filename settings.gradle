pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://files.minecraftforge.net/maven/' }
        gradlePluginPortal()
    }
}

// Version selection: ./gradlew build -Pmc=<version> loads gradle/versions/<version>.properties
def mcVersion = providers.gradleProperty('mc').get()
if (true) {
    def versionFile = new File(settingsDir, "gradle/versions/${mcVersion}.properties")
    if (!versionFile.exists()) {
        throw new GradleException("Unknown Minecraft version '${mcVersion}': ${versionFile} is missing")
    }
    def versionProps = new Properties()
    versionFile.withInputStream { versionProps.load(it) }
    gradle.beforeProject { p ->
        versionProps.each { k, v -> p.ext.set(k.toString(), v.toString()) }
    }
}

rootProject.name = 'nested_bundle_viewer'

include 'common'
include 'fabric'
include 'neoforge'

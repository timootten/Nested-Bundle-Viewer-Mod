plugins {
    // Both Loom flavours are declared; subprojects apply the matching one.
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}
// Since Minecraft 26.1 the game ships unobfuscated: no mappings and no remapJar.
ext.unobfuscated = (minecraft_version.tokenize('.')[0] as int) >= 26
// Dependency configuration names differ between remapping and no-remap Loom.
ext.modImpl = unobfuscated ? 'implementation' : 'modImplementation'
architectury {
    minecraft = project.minecraft_version
}
allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}
subprojects {
    apply plugin: rootProject.unobfuscated ? 'dev.architectury.loom-no-remap' : 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }
    if (!rootProject.unobfuscated) {
        loom {
            silentMojangMappingsLicense()
        }
    }
    dependencies {
        if (rootProject.unobfuscated) {
            minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
        } else {
            minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
            mappings loom.officialMojangMappings()
        }
    }
    java {
        withSourcesJar()
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
    }
    tasks.withType(JavaCompile).configureEach {
        it.options.release = rootProject.java_version as int
    }
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

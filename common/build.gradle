architectury {
    common rootProject.enabled_platforms.split(',')
}
// Code that depends on version-specific Minecraft APIs lives in src/compat/<variant>.
// The variant is selected per Minecraft version via `compat_variant` in gradle/versions/*.properties.
sourceSets.main.java.srcDir("src/compat/${rootProject.compat_variant}/java")
dependencies {
    // Fabric Loader only for the @Environment annotations (remapped per platform).
    "${rootProject.modImpl}" "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    "${rootProject.modImpl}" "dev.architectury:architectury:$rootProject.architectury_api_version"
}
plugins {
    id 'com.gradleup.shadow'
}
architectury {
    platformSetupLoomIde()
    neoForge()
}
configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}
repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}
dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    "${rootProject.modImpl}" "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    if (rootProject.unobfuscated) {
        common(project(path: ':common')) { transitive = false }
    } else {
        common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}
processResources {
    def props = [
        version          : project.version.toString(),
        minecraft_version: rootProject.minecraft_version
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
if (rootProject.unobfuscated) {
    // No remapping: shadowJar becomes the primary artifact, built on top of Loom's jar output.
    jar {
        archiveClassifier = 'raw'
    }
    shadowJar {
        dependsOn(jar)
        mainSpec.sourcePaths.clear()
        from(zipTree(jar.archiveFile))
        configurations = [project.configurations.shadowBundle]
        archiveClassifier = null
    }
    assemble.dependsOn shadowJar
} else {
    shadowJar {
        configurations = [project.configurations.shadowBundle]
        archiveClassifier = 'dev-shadow'
    }
    remapJar {
        inputFile.set shadowJar.archiveFile
    }
}

plugins {
    id 'com.gradleup.shadow'
}
architectury {
    platformSetupLoomIde()
    fabric()
}
configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}
dependencies {
    "${rootProject.modImpl}" "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    "${rootProject.modImpl}" "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    "${rootProject.modImpl}" "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    if (rootProject.unobfuscated) {
        common(project(path: ':common')) { transitive = false }
    } else {
        common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}
processResources {
    def props = [
        version          : project.version.toString(),
        minecraft_version: rootProject.minecraft_version,
        java_version     : rootProject.java_version
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}
if (rootProject.unobfuscated) {
    // No remapping: shadowJar becomes the primary artifact, built on top of Loom's jar output.
    jar {
        archiveClassifier = 'raw'
    }
    shadowJar {
        dependsOn(jar)
        mainSpec.sourcePaths.clear()
        from(zipTree(jar.archiveFile))
        configurations = [project.configurations.shadowBundle]
        archiveClassifier = null
    }
    assemble.dependsOn shadowJar
} else {
    shadowJar {
        configurations = [project.configurations.shadowBundle]
        archiveClassifier = 'dev-shadow'
    }
    remapJar {
        inputFile.set shadowJar.archiveFile
    }
}
